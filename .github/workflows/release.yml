name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tag must point at a commit on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Tag must match package.json version
        run: |
          version="v$(node -p "require('./package.json').version")"
          test "$version" = "$GITHUB_REF_NAME" || {
            echo "package.json is $version but the tag is $GITHUB_REF_NAME"
            exit 1
          }

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build

      - name: Package build
        run: cd dist && zip -r "../open-vitae-$GITHUB_REF_NAME.zip" .

      - name: Extract release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md || {
            echo "CHANGELOG.md has no section for $version"
            exit 1
          }

      - name: Create GitHub release
        run: gh release create "$GITHUB_REF_NAME" "open-vitae-$GITHUB_REF_NAME.zip" --title "$GITHUB_REF_NAME" --notes-file release-notes.md
        env:
          GH_TOKEN: ${{ github.token }}

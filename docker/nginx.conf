server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Fingerprinted build assets never change.
    location /assets/ {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # The service worker and manifest must always be revalidated.
    location ~* ^/(sw\.js|registerSW\.js|workbox-.*\.js|manifest\.webmanifest)$ {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # Optional grammar checking: docker compose --profile grammar up.
    # The name is resolved on each request (Docker's DNS), so nginx also starts
    # when the LanguageTool service is not running; requests then get a 502 and
    # the app says the server could not be reached.
    location /languagetool/ {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-store" always;
        limit_except GET POST { deny all; }
        client_max_body_size 256k;
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $languagetool http://languagetool:8010;
        rewrite ^/languagetool/(.*)$ /$1 break;
        proxy_pass $languagetool;
        proxy_set_header Host $host;
        proxy_set_header Cookie "";
        proxy_read_timeout 60s;
    }

    # Single-page app: unknown paths fall back to index.html.
    location / {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
